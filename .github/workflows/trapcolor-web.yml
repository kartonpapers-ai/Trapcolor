name: Trap Color web
on:
  push:
    branches: ["main", "desarrollo/paleta-trapping"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar en GitHub Pages (habilitar Pages / GitHub Actions en Settings primero)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: trapcolor-web-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: trapcolor-web
      - name: Install Trunk
        run: |
          curl -fsSL --retry 3 https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz -o /tmp/trunk.tar.gz
          tar -xzf /tmp/trunk.tar.gz -C "$HOME/.cargo/bin" trunk
      - name: Build web application
        working-directory: apps/vectorcraft-web
        run: trunk build --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trapcolor-web
          path: dist/web
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        with:
          path: dist/web
  deploy:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v5
        id: deployment
